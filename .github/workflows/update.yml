name: Update profile

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVGs
        env:
          # ACCESS_TOKEN (PAT) vidi i privatne repoe i doprinose; bez njega samo javne podatke
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
        run: python generator/gen.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --cached --quiet || (git commit -m "Update stats" && git push)
